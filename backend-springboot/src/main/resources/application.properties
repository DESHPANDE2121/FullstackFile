server.port=8080

# MongoDB (Spring Data MongoDB)
# You can override via env var: MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/curd_database}

# JWT (use 32+ chars)
# You can override via env var: JWT_SECRET
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_32CHARS_MINIMUM_123456}
app.jwt.exp.ms=${JWT_EXP_MS:86400000}

# CORS (Angular)
app.cors.allowedOrigin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
